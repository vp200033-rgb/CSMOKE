<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#0b0f19" />
  <defs>
    <pattern id="grid_de_nuke" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#151e2e" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#grid_de_nuke)" />

  <!-- Zones & Pathways -->
  <g fill="none" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.7">
    <!-- Bombsite B -->
    <rect x="220" y="240" width="180" height="180" rx="16" stroke="#ef4444" stroke-width="3.5" fill="#ef4444" fill-opacity="0.12"/>
    <text x="310" y="345" font-family="sans-serif" font-size="44" font-weight="900" fill="#ef4444" text-anchor="middle">B</text>

    <!-- Bombsite A -->
    <rect x="620" y="320" width="200" height="200" rx="16" stroke="#ef4444" stroke-width="3.5" fill="#ef4444" fill-opacity="0.12"/>
    <text x="720" y="435" font-family="sans-serif" font-size="44" font-weight="900" fill="#ef4444" text-anchor="middle">A</text>

    <!-- CT Spawn -->
    <circle cx="512" cy="210" r="75" stroke="#3b82f6" stroke-width="3" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="512" y="217" font-family="sans-serif" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle">CT SPAWN</text>

    <!-- T Spawn -->
    <circle cx="210" cy="830" r="85" stroke="#f59e0b" stroke-width="3" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="210" y="837" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">T SPAWN</text>

    <!-- Middle & Corridors -->
    <path d="M 310 420 L 310 650 L 512 650 L 512 400 Z" fill="#1e293b" fill-opacity="0.3" stroke="#475569" stroke-width="2"/>
    <path d="M 512 650 L 720 650 L 720 520" fill="#1e293b" fill-opacity="0.3" stroke="#475569" stroke-width="2"/>
    <path d="M 295 830 L 512 650" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- Title & Watermark -->
  <text x="512" y="960" font-family="sans-serif" font-size="36" font-weight="900" fill="#475569" text-anchor="middle" letter-spacing="4">DE_NUKE</text>
  <text x="512" y="990" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">TACTICAL RADAR OVERVIEW</text>
</svg>