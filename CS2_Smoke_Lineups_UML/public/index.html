<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Smoke Lineups - Tactical Map Overview</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo-area">
      <span class="logo-badge">CS2 TACTICS</span>
      <h1 class="brand-title">Smoke Lineups</h1>
    </div>

    <div class="nav-actions">
      <button id="btnOpenSubmitModal" class="btn btn-primary">+ Submit Lineup</button>
      <div id="userProfileArea">
        <button id="btnOpenAuthModal" class="btn btn-secondary">Login / Register</button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="main-container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <!-- Maps Selector -->
      <div class="sidebar-section">
        <div class="section-label">Select Active Map</div>
        <div id="mapsList" class="map-list">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="sidebar-section">
        <div class="section-label">Search Lineups</div>
        <input type="text" id="searchInput" class="search-box" placeholder="e.g. Window, Connector, Coffins...">
      </div>

      <!-- Lineups List -->
      <div class="sidebar-section" style="padding-bottom: 0;">
        <div class="section-label" id="lineupCountLabel">Available Lineups (0)</div>
      </div>
      <div id="lineupsList" class="lineups-scroll">
        <!-- Dynamically populated -->
      </div>
    </aside>

    <!-- Radar Viewer Area -->
    <main class="radar-view">
      <div class="radar-canvas-wrap">
        <img id="radarImg" class="radar-img" src="assets/radars/de_mirage.svg" alt="CS2 Radar">
        <svg id="radarSvgOverlay" class="interactive-overlay" viewBox="0 0 1024 1024">
          <!-- Trajectory lines & point markers -->
        </svg>
      </div>

      <!-- Selected Lineup Detail Overlay Card -->
      <div id="activeDetailCard" style="margin-top: 1rem; max-width: 650px; width: 100%; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 1rem; display: none;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <h3 id="detailTitle" style="font-size: 1.1rem; font-weight: bold; margin-bottom: 0.3rem;"></h3>
            <p id="detailDesc" style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 0.6rem;"></p>
            <div style="display: flex; gap: 0.5rem;">
              <span id="detailThrowType" class="badge badge-stand"></span>
              <span id="detailStatus" class="badge badge-approved"></span>
            </div>
          </div>
          <div id="adminActionGroup" style="display: none; gap: 0.5rem;">
            <button id="btnApprove" class="btn btn-success" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">Approve</button>
            <button id="btnReject" class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">Reject</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Submit Lineup Modal -->
  <div id="submitModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <h2 style="font-size: 1.25rem; font-weight: bold;">Submit New Smoke Lineup</h2>
      <form id="submitLineupForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="lineupTitle" required placeholder="e.g. Mirage Window Smoke">
        </div>
        <div class="form-group">
          <label>Throw Technique</label>
          <select id="lineupThrowType">
            <option value="0">STAND (Stationary)</option>
            <option value="1">JUMPTHROW</option>
            <option value="2">RUN_JUMPTHROW</option>
          </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <div class="form-group">
            <label>Start X / Y (Player Position)</label>
            <input type="text" id="lineupStartCoords" value="200, 800" required>
          </div>
          <div class="form-group">
            <label>End X / Y (Bloom Location)</label>
            <input type="text" id="lineupEndCoords" value="540, 480" required>
          </div>
        </div>
        <div class="form-group">
          <label>Demonstration Video URL (YouTube / Streamable)</label>
          <input type="url" id="lineupVideoUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Crosshair Screenshot URL</label>
          <input type="url" id="lineupCrosshairUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Description &amp; Instructions</label>
          <textarea id="lineupDesc" rows="3" placeholder="Aim at the antenna tip, release on jump..."></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
          <button type="button" id="btnCloseSubmitModal" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Lineup</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Auth Modal (Login / Register) -->
  <div id="authModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <h2 id="authModalTitle" style="font-size: 1.25rem; font-weight: bold;">Account Login</h2>
      <form id="authForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="authEmail" required placeholder="admin@cs2lineups.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
          <a href="#" id="toggleAuthMode" style="font-size: 0.8rem; color: #f59e0b; text-decoration: none;">Need an account? Register</a>
          <div style="display: flex; gap: 0.5rem;">
            <button type="button" id="btnCloseAuthModal" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="btnSubmitAuth" class="btn btn-primary">Login</button>
          </div>
        </div>
      </form>
      <div style="font-size: 0.75rem; color: #64748b; margin-top: 0.5rem; border-top: 1px solid #334155; padding-top: 0.5rem;">
        💡 <b>Demo accounts:</b><br>
        • Admin: <code>admin@cs2lineups.com</code> / <code>admin123</code><br>
        • User: <code>player1@cs2lineups.com</code> / <code>player123</code>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
