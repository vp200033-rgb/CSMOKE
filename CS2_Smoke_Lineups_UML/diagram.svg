<?xml version="1.0" encoding="UTF-8"?>
<svg width="1150" height="890" viewBox="0 0 1150 890" xmlns="http://www.w3.org/2000/svg" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    </marker>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-size="22" font-weight="bold" fill="#f8fafc">Counter-Strike 2 - Smoke Lineups</text>
  <text x="40" y="70" font-size="13" fill="#94a3b8">UML Class Diagram • Domain Architecture &amp; Relationships</text>

  <!-- Connectors Layer -->
  <g id="connectors">
    <!-- 1. Lineup <-> User (creates >) Solid Line -->
    <path d="M 400 370 L 290 370" stroke="#f8fafc" stroke-width="1.8" />
    <text x="375" y="362" font-size="11" font-weight="600" fill="#f8fafc">0..*</text>
    <text x="345" y="355" font-size="11" font-style="italic" font-weight="600" fill="#f59e0b" text-anchor="middle">creates &gt;</text>
    <text x="305" y="362" font-size="11" font-weight="600" fill="#f8fafc">1</text>

    <!-- 2. User <-> Lineup (added_by >) Solid Line -->
    <path d="M 290 430 L 400 430" stroke="#f8fafc" stroke-width="1.8" />
    <text x="305" y="422" font-size="11" font-weight="600" fill="#f8fafc">1</text>
    <text x="345" y="448" font-size="11" font-style="italic" font-weight="600" fill="#10b981" text-anchor="middle">added_by &gt;</text>
    <text x="375" y="422" font-size="11" font-weight="600" fill="#f8fafc">0..*</text>

    <!-- 3. Lineup <-> Map (contained in >) Solid Line -->
    <path d="M 720 390 L 830 390" stroke="#f8fafc" stroke-width="1.8" />
    <text x="735" y="382" font-size="11" font-weight="600" fill="#f8fafc">0..*</text>
    <text x="775" y="375" font-size="11" font-style="italic" font-weight="600" fill="#a855f7" text-anchor="middle">contained in &gt;</text>
    <text x="815" y="382" font-size="11" font-weight="600" fill="#f8fafc">1</text>

    <!-- 4. User -> Role (Dashed Arrow) -->
    <path d="M 180 280 L 180 215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)" />

    <!-- 5. Lineup -> ThrowType (Dashed Arrow) -->
    <path d="M 560 260 L 560 215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)" />

    <!-- 6. Lineup -> Status (Dashed Arrow) -->
    <path d="M 720 300 Q 770 250 830 205" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)" />

    <!-- 7. LineupManager -> Map (selects >) -->
    <path d="M 790 750 L 935 750 L 935 485" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)" />
    <rect x="835" y="738" width="65" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="867" y="751" font-size="10" font-weight="600" fill="#f97316" text-anchor="middle">selects &gt;</text>

    <!-- 8. LineupManager -> User (verifies_permissions >) -->
    <path d="M 370 750 L 180 750 L 180 525" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)" />
    <rect x="215" y="738" width="130" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="280" y="751" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">verifies_permissions &gt;</text>

    <!-- 9. LineupManager -> Lineup (manages >) -->
    <path d="M 560 690 L 560 665" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)" />
    <rect x="525" y="667" width="70" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="560" y="680" font-size="10" font-weight="600" fill="#3b82f6" text-anchor="middle">manages &gt;</text>

    <!-- 10. LineupManager -> Status -->
    <path d="M 790 720 Q 1060 720 1060 410 T 980 205" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)" />
  </g>

  <!-- ================= ENUMS ================= -->
  <!-- Role -->
  <g id="Role" filter="url(#cardShadow)">
    <rect x="70" y="100" width="220" height="110" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <rect x="70" y="100" width="220" height="34" rx="10" fill="#ec4899" fill-opacity="0.2" />
    <text x="180" y="113" font-size="9.5" font-weight="bold" fill="#ec4899" text-anchor="middle">&lt;&lt;ENUM&gt;&gt;</text>
    <text x="180" y="127" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Role</text>
    <line x1="70" y1="134" x2="290" y2="134" stroke="#ec4899" stroke-width="1" />
    <text x="85" y="152" font-size="11.5" font-family="monospace" fill="#f8fafc">GUEST : 0</text>
    <text x="85" y="171" font-size="11.5" font-family="monospace" fill="#f8fafc">USER : 1</text>
    <text x="85" y="190" font-size="11.5" font-family="monospace" fill="#f8fafc">ADMIN : 2</text>
  </g>

  <!-- ThrowType -->
  <g id="ThrowType" filter="url(#cardShadow)">
    <rect x="450" y="100" width="220" height="110" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <rect x="450" y="100" width="220" height="34" rx="10" fill="#ec4899" fill-opacity="0.2" />
    <text x="560" y="113" font-size="9.5" font-weight="bold" fill="#ec4899" text-anchor="middle">&lt;&lt;ENUM&gt;&gt;</text>
    <text x="560" y="127" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">ThrowType</text>
    <line x1="450" y1="134" x2="670" y2="134" stroke="#ec4899" stroke-width="1" />
    <text x="465" y="152" font-size="11.5" font-family="monospace" fill="#f8fafc">STAND : 0</text>
    <text x="465" y="171" font-size="11.5" font-family="monospace" fill="#f8fafc">JUMPTHROW : 1</text>
    <text x="465" y="190" font-size="11.5" font-family="monospace" fill="#f8fafc">RUN_JUMPTHROW : 2</text>
  </g>

  <!-- Status -->
  <g id="Status" filter="url(#cardShadow)">
    <rect x="830" y="100" width="220" height="110" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <rect x="830" y="100" width="220" height="34" rx="10" fill="#ec4899" fill-opacity="0.2" />
    <text x="940" y="113" font-size="9.5" font-weight="bold" fill="#ec4899" text-anchor="middle">&lt;&lt;ENUM&gt;&gt;</text>
    <text x="940" y="127" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Status</text>
    <line x1="830" y1="134" x2="1050" y2="134" stroke="#ec4899" stroke-width="1" />
    <text x="845" y="152" font-size="11.5" font-family="monospace" fill="#f8fafc">PENDING : 0</text>
    <text x="845" y="171" font-size="11.5" font-family="monospace" fill="#f8fafc">APPROVED : 1</text>
    <text x="845" y="190" font-size="11.5" font-family="monospace" fill="#f8fafc">REJECTED : 2</text>
  </g>

  <!-- ================= CLASSES ================= -->
  <!-- User -->
  <g id="User" filter="url(#cardShadow)">
    <rect x="70" y="280" width="220" height="240" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="70" y="280" width="220" height="38" rx="10" fill="#10b981" fill-opacity="0.2" />
    <text x="180" y="304" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">User</text>
    <line x1="70" y1="318" x2="290" y2="318" stroke="#10b981" stroke-width="1" />
    <!-- Attributes -->
    <text x="82" y="336" font-size="11" font-family="monospace" fill="#93c5fd">- id: int</text>
    <text x="82" y="354" font-size="11" font-family="monospace" fill="#93c5fd">- email: string</text>
    <text x="82" y="372" font-size="11" font-family="monospace" fill="#93c5fd">- passwordHash: string</text>
    <text x="82" y="390" font-size="11" font-family="monospace" fill="#93c5fd">- role: Role</text>
    <text x="82" y="408" font-size="11" font-family="monospace" fill="#93c5fd">- createdAt: datetime</text>
    <!-- Separator -->
    <line x1="70" y1="422" x2="290" y2="422" stroke="#334155" stroke-width="1" />
    <!-- Methods -->
    <text x="82" y="442" font-size="11" font-family="monospace" fill="#6ee7b7">+ register(): void</text>
    <text x="82" y="462" font-size="11" font-family="monospace" fill="#6ee7b7">+ login(): string</text>
    <text x="82" y="482" font-size="11" font-family="monospace" fill="#6ee7b7">+ logout(): void</text>
  </g>

  <!-- Lineup -->
  <g id="Lineup" filter="url(#cardShadow)">
    <rect x="400" y="260" width="320" height="400" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2.2" />
    <rect x="400" y="260" width="320" height="38" rx="10" fill="#3b82f6" fill-opacity="0.2" />
    <text x="560" y="284" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">Lineup</text>
    <line x1="400" y1="298" x2="720" y2="298" stroke="#3b82f6" stroke-width="1.2" />
    <!-- Attributes -->
    <text x="415" y="317" font-size="11" font-family="monospace" fill="#93c5fd">- id: int</text>
    <text x="415" y="335" font-size="11" font-family="monospace" fill="#93c5fd">- title: string</text>
    <text x="415" y="353" font-size="11" font-family="monospace" fill="#93c5fd">- startX: float</text>
    <text x="415" y="371" font-size="11" font-family="monospace" fill="#93c5fd">- startY: float</text>
    <text x="415" y="389" font-size="11" font-family="monospace" fill="#93c5fd">- endX: float</text>
    <text x="415" y="407" font-size="11" font-family="monospace" fill="#93c5fd">- endY: float</text>
    <text x="415" y="425" font-size="11" font-family="monospace" fill="#93c5fd">- videoUrl: string</text>
    <text x="415" y="443" font-size="11" font-family="monospace" fill="#93c5fd">- crosshairImageUrl: string</text>
    <text x="415" y="461" font-size="11" font-family="monospace" fill="#93c5fd">- throwType: ThrowType</text>
    <text x="415" y="479" font-size="11" font-family="monospace" fill="#93c5fd">- description: string</text>
    <text x="415" y="497" font-size="11" font-family="monospace" fill="#93c5fd">- status: Status</text>
    <text x="415" y="515" font-size="11" font-family="monospace" fill="#93c5fd">- createdAt: datetime</text>
    <!-- Separator -->
    <line x1="400" y1="528" x2="720" y2="528" stroke="#334155" stroke-width="1" />
    <!-- Methods -->
    <text x="415" y="552" font-size="11" font-family="monospace" fill="#6ee7b7">+ save(): void</text>
    <text x="415" y="574" font-size="11" font-family="monospace" fill="#6ee7b7">+ updateStatus(status: Status): void</text>
    <text x="415" y="596" font-size="11" font-family="monospace" fill="#6ee7b7">+ delete(): void</text>
  </g>

  <!-- Map -->
  <g id="Map" filter="url(#cardShadow)">
    <rect x="830" y="290" width="220" height="195" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect x="830" y="290" width="220" height="38" rx="10" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="940" y="314" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">Map</text>
    <line x1="830" y1="328" x2="1050" y2="328" stroke="#8b5cf6" stroke-width="1" />
    <!-- Attributes -->
    <text x="842" y="348" font-size="11" font-family="monospace" fill="#93c5fd">- id: int</text>
    <text x="842" y="368" font-size="11" font-family="monospace" fill="#93c5fd">- name: string</text>
    <text x="842" y="388" font-size="11" font-family="monospace" fill="#93c5fd">- radarImageUrl: string</text>
    <!-- Separator -->
    <line x1="830" y1="404" x2="1050" y2="404" stroke="#334155" stroke-width="1" />
    <!-- Methods -->
    <text x="842" y="428" font-size="11" font-family="monospace" fill="#6ee7b7">+ getRadars(): List&lt;Map&gt;</text>
  </g>

  <!-- LineupManager -->
  <g id="LineupManager" filter="url(#cardShadow)">
    <rect x="370" y="690" width="420" height="145" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2.2" />
    <rect x="370" y="690" width="420" height="38" rx="10" fill="#f97316" fill-opacity="0.2" />
    <text x="580" y="714" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">LineupManager</text>
    <line x1="370" y1="728" x2="790" y2="728" stroke="#f97316" stroke-width="1.2" />
    <!-- Methods -->
    <text x="388" y="752" font-size="11" font-family="monospace" fill="#6ee7b7">+ getLineupsByMap(mapId: int): List&lt;Lineup&gt;</text>
    <text x="388" y="774" font-size="11" font-family="monospace" fill="#6ee7b7">+ searchLineups(query: string): List&lt;Lineup&gt;</text>
    <text x="388" y="796" font-size="11" font-family="monospace" fill="#6ee7b7">+ verifyLineup(lineupId: int, newStatus: Status): void</text>
  </g>
</svg>